# ---------------------------------------------------------------------------
# OAuth 2.0 Authorization Server
# ---------------------------------------------------------------------------
# Issuer URI published in the OIDC discovery document (/.well-known/openid-configuration).
# Override this property per environment. Production MUST use HTTPS.
# Example: spring.security.oauth2.authorizationserver.issuer=https://auth.example.com
spring.security.oauth2.authorizationserver.issuer=${OAUTH2_ISSUER_URI:http://localhost:8080}

# ---------------------------------------------------------------------------
# OAuth 2.0 Resource Server - validates tokens issued by the Authorization Server
# ---------------------------------------------------------------------------
# The resource server fetches the public JWK Set from the Authorization Server's
# /oauth2/jwks endpoint to verify token signatures at runtime.
# Production MUST use HTTPS. Set OAUTH2_ISSUER_URI environment variable in deployment.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8080}

